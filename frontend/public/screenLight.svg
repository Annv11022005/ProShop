<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>
  
  <rect width="800" height="1000" fill="url(#bgGrad)" rx="24" />
  
  <!-- Glow orbs -->
  <circle cx="300" cy="400" r="180" fill="#60a5fa" opacity="0.25" filter="url(#blurFilter)" />
  <circle cx="520" cy="580" r="160" fill="#a78bfa" opacity="0.25" filter="url(#blurFilter)" />
  
  <!-- Flowing waves -->
  <path d="M100 700 C 250 500, 450 850, 700 450" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" fill="none" opacity="0.4" />
  <path d="M150 780 C 320 600, 500 900, 750 550" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.3" />

  <!-- Center Card / Padlock -->
  <g transform="translate(250, 350)">
    <rect x="0" y="50" width="300" height="250" rx="36" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Shackle -->
    <path d="M75 60 V-10 C75 -55, 225 -55, 225 -10 V60" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round" fill="none" />
    
    <!-- Keyhole -->
    <circle cx="150" cy="150" r="22" fill="url(#primaryGrad)" />
    <path d="M142 165 L138 215 H162 L158 165 Z" fill="url(#primaryGrad)" />
  </g>
</svg>
